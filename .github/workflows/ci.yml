name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pycodestyle src
      - run: pydocstyle src
      - run: python -m mypy src
      - run: pyright

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bandit -r src

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-fail-under=85

  update-build:
    if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0 # Necesario para evitar errores al hacer git push
      - run: echo $(( $(cat BUILD 2>/dev/null || echo 0) + 1 )) > BUILD
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD
          git commit -m "chore: BUILD $(cat BUILD) [skip ci]"
          git push

  docs:
    # Corre en PRs hacia main y en cada push/merge a main (post-merge)
    # Construye la documentación y la deja disponible como artifact descargable.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    needs: [lint, security, tests] # solo si los tres anteriores pasaron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sphinx-build -b html docs docs/_build/html
      - run: touch docs/_build/html/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html

  docs-save:
    # Guarda la documentación construida en docs/build/ del repositorio
    # solo tras el merge a main (push a refs/heads/main). Nunca en PRs.
    if: github.ref == 'refs/heads/main'
    needs: [docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-save
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: rm -rf docs/build && sphinx-build -b html docs docs/build
      - run: touch docs/build/.nojekyll
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/build
          git commit -m "chore: documentacion $(cat VERSION 2>/dev/null || echo latest) [skip ci]" && git push || echo "No hay cambios en la documentacion"
