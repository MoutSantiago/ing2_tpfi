name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pycodestyle src
      - run: pydocstyle src
      - run: python -m mypy src
      - run: pyright

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bandit -r src

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-fail-under=85

  update-build:
    if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: echo $(( $(cat BUILD 2>/dev/null || echo 0) + 1 )) > BUILD
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD
          git commit -m "chore: BUILD $(cat BUILD) [skip ci]"
          git push

  docs:
    # Solo al integrar a main (no en develop)
    if: github.base_ref == 'main'
    needs: [lint, security, tests] # solo si los tres anteriores pasaron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html
